name: 旭川消防出動監視

on:
  push:
    paths:
      - ".github/workflows/monitor.yml"
  schedule:
    # 自動連鎖が止まった場合の復旧用（毎時17分）。
    - cron: "17 * * * *"
    # 公開リポジトリの定期実行が休止されないよう月1回更新する。
    - cron: "23 3 1 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: asahikawa-dispatch-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: iPhoneメンション通知をテスト
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[mention-test]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 2 --body "@gudetama1227-svg 自動監視からのメンション通知テストです。"

      - name: 出動情報を確認
        if: github.event.schedule != '23 3 1 * *'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 monitor.py

      - name: 上川レーダーを更新
        if: github.event.schedule != '23 3 1 * *'
        env:
          KAMIKAWA_SITES_TOKEN: ${{ secrets.KAMIKAWA_SITES_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          test -n "$KAMIKAWA_SITES_TOKEN"
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors \
            --max-time 150 \
            -X POST \
            -H "OAI-Sites-Authorization: Bearer $KAMIKAWA_SITES_TOKEN" \
            -H "Authorization: Bearer $KAMIKAWA_SITES_TOKEN" \
            -H "X-Threads-Access-Token: $THREADS_ACCESS_TOKEN" \
            https://kamikawa-news-radar.gudetama1227.chatgpt.site/api/cron/scan

      - name: 定期実行を維持
        if: github.event.schedule == '23 3 1 * *'
        run: |
          date -u +%Y-%m-%d > .monitor-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .monitor-heartbeat
          git commit -m "監視ワークフローを維持" || exit 0
          git push

      - name: 約5分後の監視を予約
        if: github.event.schedule != '23 3 1 * *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 285
          gh workflow run monitor.yml --ref main
