name: 旭川消防出動監視

on:
  push:
    paths:
      - ".github/workflows/monitor.yml"
  schedule:
    # 自動連鎖が止まった場合の復旧用（毎時17分）。
    - cron: "17 * * * *"
    # 公開リポジトリの定期実行が休止されないよう月1回更新する。
    - cron: "23 3 1 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: asahikawa-dispatch-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 出動情報を確認
        if: github.event.schedule != '23 3 1 * *'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 monitor.py

      - name: 定期実行を維持
        if: github.event.schedule == '23 3 1 * *'
        run: |
          date -u +%Y-%m-%d > .monitor-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .monitor-heartbeat
          git commit -m "監視ワークフローを維持" || exit 0
          git push

      - name: 約5分後の監視を予約
        if: github.event.schedule != '23 3 1 * *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 285
          gh workflow run monitor.yml --ref main
