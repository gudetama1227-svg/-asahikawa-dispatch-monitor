name: 旭川消防出動監視

on:
  push:
    paths:
      - ".github/workflows/monitor.yml"
      - "monitor_x.py"
  schedule:
    # 自動連鎖が止まった場合の復旧用（毎時17分）。
    - cron: "17 * * * *"
    # 公開リポジトリの定期実行が休止されないよう月1回更新する。
    - cron: "23 3 1 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: asahikawa-dispatch-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: iPhoneメンション通知をテスト
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[mention-test]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 2 --body "@gudetama1227-svg 自動監視からのメンション通知テストです。"

      - name: 出動情報を確認
        if: github.event.schedule != '23 3 1 * *'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 monitor.py

      - name: AgentReach方式でXを補助監視
        if: github.event.schedule != '23 3 1 * *'
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: |
          if [ -z "$TWITTER_AUTH_TOKEN" ] || [ -z "$TWITTER_CT0" ]; then
            printf '%s' '{"connected":false,"status":"not_configured","checked":0,"detections":[],"error":null}' > /tmp/x-monitor.json
          elif [ $(( $(date +%s) / 300 % 3 )) -eq 0 ]; then
            if python3 -m pip install --quiet --disable-pip-version-check twitter-cli==0.8.6 \
              && python3 monitor_x.py > /tmp/x-monitor.json; then
              true
            else
              printf '%s' '{"connected":true,"status":"error","checked":0,"detections":[],"error":"AgentReach backend failed"}' > /tmp/x-monitor.json
            fi
          else
            printf '%s' '{"connected":true,"status":"skipped","checked":0,"detections":[],"error":null}' > /tmp/x-monitor.json
          fi

      - name: 上川レーダーを更新
        if: github.event.schedule != '23 3 1 * *'
        env:
          KAMIKAWA_SITES_TOKEN: ${{ secrets.KAMIKAWA_SITES_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          test -n "$KAMIKAWA_SITES_TOKEN"
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors \
            --max-time 150 \
            -X POST \
            -H "OAI-Sites-Authorization: Bearer $KAMIKAWA_SITES_TOKEN" \
            -H "Authorization: Bearer $KAMIKAWA_SITES_TOKEN" \
            -H "X-Threads-Access-Token: $THREADS_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/x-monitor.json \
            https://kamikawa-news-radar.gudetama1227.chatgpt.site/api/cron/scan

      - name: 定期実行を維持
        if: github.event.schedule == '23 3 1 * *'
        run: |
          date -u +%Y-%m-%d > .monitor-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .monitor-heartbeat
          git commit -m "監視ワークフローを維持" || exit 0
          git push

      - name: 約5分後の監視を予約
        if: github.event.schedule != '23 3 1 * *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 285
          gh workflow run monitor.yml --ref main
