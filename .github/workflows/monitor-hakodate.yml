name: 函館消防出動監視

on:
  push:
    paths:
      - ".github/workflows/monitor-hakodate.yml"
      - "monitor_hakodate.py"
  schedule:
    # 自動連鎖が止まった場合の復旧用（毎時37分）。
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: hakodate-dispatch-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 函館の出動情報を確認
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 monitor_hakodate.py

      - name: 約5分後の監視を予約
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 285
          gh workflow run monitor-hakodate.yml --ref main
